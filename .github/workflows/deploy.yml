name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-rider-web
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Rebuild & re-serve rider web on the VM
        run: |
          set -euo pipefail
          APP=/home/c2o_ubuntu/hoppin-apps/hoppin-rider-mobile-app
          git -C "$APP" fetch origin main
          git -C "$APP" reset --hard origin/main
          flock /tmp/hoppin-deploy.lock docker run --rm \
            -v "$APP:/src" -w /src/rider_app ghcr.io/cirruslabs/flutter:stable \
            bash -lc 'git config --global --add safe.directory /src && flutter pub get && flutter build web --release -t lib/main.dart --dart-define-from-file=defines.json'
          docker restart hoppin-rider-web
          echo "deployed rider-web @ $(git -C "$APP" rev-parse --short HEAD)"
