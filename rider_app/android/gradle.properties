# Keep release builds within the VM/workstation memory budget.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Keep the legacy Kotlin plugin path enabled for Android plugins that still
# apply kotlin-android while the dependency graph migrates to AGP 9.
android.builtInKotlin=false
