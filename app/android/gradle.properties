# Reduced from -Xmx8G: this laptop has ~4G RAM free, and an 8G heap + 4G metaspace
# was OOM-killing the Gradle daemon mid-transform (the "transform output must exist"
# and flutter-plugin-loader NoSuchFile failures). 2G is plenty for Gradle here.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
