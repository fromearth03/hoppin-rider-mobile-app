name: hoppin_shared
description: Shared Hoppin mobile core — API client for the ride-service (:8080), typed models, Supabase auth, and cross-cutting utilities used by both the rider and driver apps.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # HTTP client for the ride-service REST API (:8080). Interceptors attach the
  # Supabase bearer token and normalise the { error, code } envelope.
  dio: ^5.10.0

  # Supabase auth (GoTrue). The apps authenticate DIRECTLY with Supabase — the
  # ride-service only verifies the JWT it is sent. See docs 04-app-api-reference.
  supabase_flutter: ^2.15.4

  # State management. Riverpod = the mainstream, well-documented Flutter choice.
  flutter_riverpod: ^3.3.2

  # Immutable model + JSON (de)serialisation codegen.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_lints: ^6.0.0

flutter:
